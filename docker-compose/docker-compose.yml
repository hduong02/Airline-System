# =============================================================================
# Airline Microservices — Docker Compose
# =============================================================================
# ONLY API GATEWAY (Port 5000) is exposed externally
# All other services are internal only
# =============================================================================

services:

  # ===========================================================================
  # DATABASES
  # ===========================================================================
  userdb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: userdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3302:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_user
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  airlinedb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: airlinedb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3303:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  flightdb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: flightdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3304:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_flight_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  locationdb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: locationdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3305:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_location_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  seatdb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: seatdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_seat_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  pricingdb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: pricingdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_pricing_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  ancillarydb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: ancillarydb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_ancillary_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  bookingdb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: bookingdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_booking_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  paymentdb:
    restart: unless-stopped
    image: mysql:8.0
    container_name: paymentdb
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_payment_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
  # ===========================================================================
  # REDIS CACHE
  # ===========================================================================

  redis:
    image: redis:8.10-alpine
    container_name: redis
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.5
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # KAFKA (KRaft Mode - No Zookeeper)
  # ===========================================================================

  kafka:
    restart: unless-stopped
    image: apache/kafka:4.3.1
    container_name: kafka
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx1g"

  # ===========================================================================
  # CONFIG SERVER
  # ===========================================================================

  config-server:
    image: "andyy02/config-server:${AIRLINE_IMAGE_TAG:?Set AIRLINE_IMAGE_TAG to the built deployment version}"
    container_name: config-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5

    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "${CONFIG_GIT_URI:-https://github.com/hduong02/airline-system-config.git}"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
      
  # ===========================================================================
  # SERVICE REGISTRY (Eureka)
  # ===========================================================================

  service-registry:
    restart: unless-stopped
    image: "andyy02/service-registry:${AIRLINE_IMAGE_TAG:?Set AIRLINE_IMAGE_TAG to the built deployment version}"
    container_name: eureka-server
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5

    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # API GATEWAY - ONLY EXTERNALLY EXPOSED SERVICE
  # ===========================================================================

  api-gateway:
    image: "andyy02/api-gateway:${AIRLINE_IMAGE_TAG:?Set AIRLINE_IMAGE_TAG to the built deployment version}"
    container_name: api-gateway
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "5000:5000"  # ONLY PORT EXPOSED TO THE WORLD
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "api-gateway"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped

  # ===========================================================================
  # BUSINESS SERVICES - ALL INTERNAL (NO PORTS EXPOSED)
  # ===========================================================================

  user-service:
    image: "andyy02/user-service:${AIRLINE_IMAGE_TAG:?Set AIRLINE_IMAGE_TAG to the built deployment version}"
    container_name: user-service
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/5001;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      userdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "user-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://userdb:3306/airline_user?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped

  airline-service:
    restart: unless-stopped
    image: "andyy02/airline-service:${AIRLINE_IMAGE_TAG:?Set AIRLINE_IMAGE_TAG to the built deployment version}"
    container_name: airline-service
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/5002;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      airlinedb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "airline-service"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://airlinedb:3306/airline_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"

  flight-service:
    restart: unless-stopped
    image: "andyy02/flight-service:${AIRLINE_IMAGE_TAG:?Set AIRLINE_IMAGE_TAG to the built deployment version}"
    container_name: flight-service
    healthcheck:
