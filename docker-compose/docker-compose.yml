      service-registry:
        condition: service_healthy
      paymentdb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "payment-service"
      STRIPE_API_KEY: "${STRIPE_API_KEY:?Set STRIPE_API_KEY for the target Stripe account}"
      STRIPE_CALLBACK_BASE_URL: "${STRIPE_CALLBACK_BASE_URL:?Set STRIPE_CALLBACK_BASE_URL to the frontend URL}"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      SPRING_DATASOURCE_URL: "jdbc:mysql://paymentdb:3306/airline_payment_db?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"

  # MailHog captures mail for this development stack.
  # For real delivery, configure notification-service with your SMTP provider.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  notification-service:
    image: "andyy02/notification-service:${AIRLINE_IMAGE_TAG:?Set AIRLINE_IMAGE_TAG to the built deployment version}"
    container_name: notification-service
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/5011;
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          head -1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      kafka:
        condition: service_started
      mailhog:
        condition: service_started
    environment:
      SPRING_APPLICATION_NAME: "notification-service"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888/"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://service-registry:8761/eureka/"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: "${MAIL_HOST:-mailhog}"
      MAIL_PORT: "${MAIL_PORT:-1025}"
      MAIL_FROM: "${MAIL_FROM:-notifications@airlines.test}"
      SPRING_MAIL_USERNAME: "${MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-false}"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${MAIL_STARTTLS_ENABLE:-false}"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    restart: unless-stopped
