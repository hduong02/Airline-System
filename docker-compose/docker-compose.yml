    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      pricingdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "pricing-service"
      SPRING_DATA_REDIS_HOST: redis
