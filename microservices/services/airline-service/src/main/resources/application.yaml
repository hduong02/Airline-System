server:
  port: 5002

spring:
  application:
    name: airline-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/airline_db
    username: root
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true