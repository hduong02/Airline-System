server:
  port: 5009

spring:
  application:
    name: booking-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/airline_booking_db
    username: root
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: booking-service-group
  eureka:
    client:
      register-with-eureka: true
      fetch-registry: true
    instance:
      prefer-ip-address: true
  
